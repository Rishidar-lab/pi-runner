name: CI

on:
  push:
    branches: [master, rebuild/cpp-wasm-endless-runner]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: C++ core tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + run the native C++ suite
        run: npm run test:core
        # CMake + g++ are preinstalled on ubuntu-latest; no Node deps needed.

  js-tests:
    name: backend / replay / rewards tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Run the JS suites (first pass)
        run: npm run test:js
      # Idempotency guard: the reward suite now wipes its isolated ledger before
      # loading and flushes the store's debounced write before cleanup, so a
      # second consecutive run must pass with no manual rm (OpenCode task 001).
      - name: Run the JS suites (idempotency pass)
        run: npm run test:js

  wasm-build:
    name: Emscripten build + committed-artifact check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          # TODO(LANE 0): pin to the emsdk version that produced the committed
          # public/ + server/pirun_core_node.js so the reproducibility check can
          # be made fatal. Using latest until that version is identified.
          version: latest
          actions-cache-folder: emsdk-cache
      - run: emcc --version
      - run: npm ci

      # The normal two-file dev build (web/src/core/*.{js,wasm} -> public/).
      - name: npm run build
        run: npm run build

      # Regenerate the committed self-contained artifacts and check they still
      # match what's in git. Emscripten output can drift between emsdk versions,
      # so a diff here is reported, not fatal — until the emsdk version that
      # produced the committed artifacts is pinned (see PI_RUNNER_BACKLOG LANE 0).
      - name: npm run build:dist (reproducibility check — informational)
        run: |
          npm run build:dist
          if ! git diff --quiet -- public server/pirun_core_node.js; then
            echo "::warning::committed public/ or server/pirun_core_node.js differs from a fresh build:dist (likely emsdk version drift)"
            git diff --stat -- public server/pirun_core_node.js || true
          else
            echo "committed artifacts reproduce exactly"
          fi

      - name: Standalone shareable preview build
        run: |
          em++ core/src/sim.cpp core/bindings/wasm.cpp -I core/include -std=c++17 -O3 --bind \
            -sMODULARIZE=1 -sEXPORT_ES6=1 -sEXPORT_NAME=createPirunCore -sENVIRONMENT=web \
            -sALLOW_MEMORY_GROWTH=1 -sFILESYSTEM=0 -sSINGLE_FILE=1 -o /tmp/pirun_core_single.js
          node scripts/build-preview.mjs /tmp/pirun_core_single.js preview.html
          test -s preview.html
