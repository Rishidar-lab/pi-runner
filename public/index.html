<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pi Runner</title>

  <!-- Pi Network SDK. Must load before any Pi.* call. -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <!-- Distinctive display font with a graceful system fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Chivo:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main class="shell">
    <header class="hud">
      <div class="brand">
        <span class="mark">π</span>
        <span class="title">RUNNER</span>
      </div>
      <div class="hud-right">
        <div class="score-wrap">
          <div class="score" id="score">0</div>
          <div class="best" id="best">BEST 0</div>
        </div>
        <button class="pi-chip" id="loginBtn" type="button">Login with Pi</button>
      </div>
    </header>

    <div class="stage">
      <canvas id="game"></canvas>

      <!-- Start / game-over overlay -->
      <div class="overlay" id="overlay">
        <div class="panel">
          <div class="panel-eyebrow" id="panelEyebrow">ARCADE</div>
          <h1 class="panel-title" id="panelTitle">PI RUNNER</h1>
          <p class="panel-sub" id="panelSub">
            Tap left or right to drift between lanes.<br />
            Catch the <b>π</b> tokens. Dodge the blocks.
          </p>
          <div class="panel-stats" id="panelStats" hidden>
            <div><span id="finalScore">0</span><small>SCORE</small></div>
            <div><span id="finalBest">0</span><small>BEST</small></div>
          </div>
          <button class="btn-primary" id="playBtn" type="button">PLAY</button>
          <button class="btn-ghost" id="unlockBtn" type="button">
            Unlock Gold Orb + Shield · <b>1&nbsp;π</b>
          </button>
          <p class="panel-note" id="panelNote">Optional. The game is fully playable for free.</p>
        </div>
      </div>

      <!-- transient toast -->
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <footer class="foot">
      <span id="userTag">Not signed in</span>
      <span class="dot">•</span>
      <span id="skinTag">Classic orb</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
